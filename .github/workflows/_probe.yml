name: probe
on:
  push:
    branches: ['arena/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect env
        run: |
          mkdir -p out
          {
            echo "runner=$(uname -a)"
            echo "java="; java -version 2>&1 | head -2
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_HOME" 2>/dev/null | tr '\n' ' '
            echo
            echo "platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' '
            echo; echo "build-tools:"; ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' '
            echo; echo "ndk:"; ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' '
            echo; echo "network google:"; curl -sS -o /dev/null -w "%{http_code}" https://dl.google.com/ || true
            echo; echo "network maven:"; curl -sS -o /dev/null -w "%{http_code}" https://repo1.maven.org/maven2/ || true
            echo; echo "network gradle:"; curl -sS -o /dev/null -w "%{http_code}" https://services.gradle.org/ || true
          } > out/probe.txt 2>&1
      - name: Push result
        run: |
          git config user.email "bot@arena.ai"
          git config user.name "Arena Bot"
          git clone --depth 1 --branch ci-probe https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ci 2>/dev/null || \
          (git init -q ci && cd ci && git checkout -q -b ci-probe && git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git)
          cd ci
          cp ../out/probe.txt .
          git add -A
          git commit -q -m "probe $(date -u +%s)" && git push -q origin ci-probe 2>&1 | tail -2 || echo "nothing to commit"
